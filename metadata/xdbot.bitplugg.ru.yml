AutoName: XDDBOT

Summary: BLE-компаньон для вашего собственного электросамоката
Description: |-
    XDDBOT — открытый клиент-компаньон для вашего собственного
    электросамоката: подключение по BLE, диагностика, команды
    (открыть/закрыть, поиск, звук), работа с вашим ключом устройства.

    Приложение не генерирует и не подбирает ключи. Оно хранит только те
    ключи, которые вы вводите вручную, и передаёт их лишь подключённому
    вами самокату при рукопожатии. Ключи лежат на устройстве в
    зашифрованном виде.

    Есть демо-режим для проверки интерфейса без железа. Телеметрия
    выключена по умолчанию; её можно включить вручную в настройках.

    Интерфейс: русский и английский. Material You (Android 12+).

RepoType: git
Repo: https://github.com/bitplugg/XDDbot.git

